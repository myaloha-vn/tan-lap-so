âm nghiệp, với các cây trồng chính như cao su, mía; chăn nuôi phát triển mạnh và chuyển dần từ hộ nhỏ lẻ sang trang trại.`,`Theo báo cáo của UBND xã (8/2026), trên địa bàn có 21 trang trại chăn nuôi (17 trang trại đang hoạt động), 44 nhà yến và 336 hộ chăn nuôi nhỏ lẻ. Xã đã công khai 7 khu vực không được phép chăn nuôi theo Nghị quyết số 54/2026/NQ-HĐND của HĐND tỉnh.`]},{heading:`Định hướng chuyển đổi số`,body:[`Đến tháng 8/2026, 428 thủ tục hành chính thuộc thẩm quyền của xã đều được cung cấp trực tuyến; tỷ lệ hồ sơ nộp trực tuyến đạt 99,07%, số hóa hồ sơ và thanh toán trực tuyến đạt 100%. Xã triển khai phong trào “Bình dân học vụ số” và Tổ công nghệ số cộng đồng hỗ trợ người cao tuổi, đồng bào dân tộc thiểu số ở vùng biên.`,`Cổng thông tin Tân Lập Số được xây dựng nhằm công khai, minh bạch thông tin; giúp người dân tra cứu thủ tục, gửi phản ánh – kiến nghị, nắm bắt chính sách an sinh và kết nối nhanh với chính quyền xã.`,`Nội dung trên cổng đang được UBND xã cập nhật dần. Các số liệu chưa có nguồn chính thức được ghi "Đang cập nhật".`]}],Ce={dang:{label:`Đảng ủy`,desc:`Ban Thường vụ, Ban Chấp hành Đảng bộ xã và các cơ quan tham mưu, giúp việc.`,groups:[{group:`Thường trực Đảng ủy`,people:[{name:`Nguyễn Trọng Tấn`,title:`Bí thư Đảng ủy, Chủ tịch HĐND xã`},{name:`Trịnh Hoài Phong`,title:`Phó Bí thư Thường trực Đảng ủy, Chủ tịch Ủy ban MTTQ Việt Nam xã`},{name:`Nguyễn Thị Nga`,title:`Phó Bí thư Đảng ủy, Chủ tịch UBND xã`}]},{group:`Văn phòng Đảng ủy`,people:[{name:``,title:`Chánh Văn phòng Đảng ủy`}]},{group:`Ủy ban Kiểm tra Đảng ủy`,people:[{name:``,title:`Chủ nhiệm Ủy ban Kiểm tra Đảng ủy`}]},{group:`Ban Xây dựng Đảng`,people:[{name:`Nguyễn Thị Thanh`,title:`Ủy viên Ban Thường vụ, Trưởng Ban Xây dựng Đảng`}]}]},hdnd:{label:`HĐND`,desc:`Hội đồng nhân dân xã — cơ quan quyền lực nhà nước ở địa phương.`,groups:[{group:`Thường trực HĐND`,people:[{name:`Nguyễn Trọng Tấn`,title:`Chủ tịch HĐND xã`},{name:`Nguyễn Thị Cúc`,title:`Phó Chủ tịch HĐND xã`}]},{group:`Các Ban củ tích lịch sử cấp quốc gia ngày 31/8/1990 và được Thủ tướng Chính phủ xếp hạng di tích quốc gia đặc biệt vào tháng 5/2012.`,`Ngày 15/01/2026, Thủ tướng Chính phủ ban hành Quyết định số 88/QĐ-TTg phê duyệt nhiệm vụ lập quy hoạch khu di tích, với phạm vi khoảng 241,25 ha (khu nghiên cứu khoảng 291,25 ha), gồm 3 cụm: Căn cứ Trung ương Cục miền Nam, Căn cứ Mặt trận Dân tộc Giải phóng miền Nam và Căn cứ Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam.`,`Năm 2025, khu di tích đã hoàn thành, nâng cấp một số hạng mục; nhà trưng bày được trang bị thiết bị số và trình chiếu phim tư liệu bằng công nghệ 3D mapping. Từ năm 2026, tỉnh đầu tư khoảng 20,64 tỷ đồng tu bổ các nhà phục dựng tại cả 3 cụm di tích, dự kiến hoàn thành trước ngày 30/4/2027.`,`Du khách có thể tham quan các hạng mục được phục dựng như hội trường, nhà làm việc của các đồng chí lãnh đạo, hầm trú ẩn, giao thông hào, bếp Hoàng Cầm; cùng khu trưng bày hiện vật và đường mòn xuyên rừng.`],highlights:[`Di tích quốc gia đặc biệt (2012)`,`Hội trường, nhà làm việc được phục dựng`,`Nhà trưng bày số, phim tư liệu 3D mapping`,`Hầm chữ A, giao thông hào, bếp Hoàng Cầm`,`Khu trưng bày hiện vật kháng chiến`,`Đường mòn xuyên rừng, suối Tiên Cô`],mapQuery:`Căn cứ Trung ương Cục miền Nam, Tây Ninh`,verified:!0}],Ne=[{name:`Về nguồn – Căn cứ Trung ương Cục miền Nam`,duration:`Khoảng nửa ngày`,desc:`Tham quan khu di tích, nghe thuyết minh lịch sử kháng chiến, trải nghiệm đường mòn xuyên rừng Rùm Đuôn – Chàng Riệc.`,stops:[`can-cu-trung-uong-cuc-mien-nam`]}],Pe=[{name:`Quy hoạch bảo quản, tu bổ, phục hồi Khu di tích Căn cứ Trung ương Cục miền Nam`,type:`Quy hoạch di tích`,scale:`Khoảng 241,25 ha`,status:`Đã duyệt nhiệm vụ (QĐ 88/QĐ-TTg, 15/01/2026)`,desc:`Phạm vi gồm Căn cứ Trung ương Cục miền Nam (151,25 ha), Căn cứ Chính phủ Cách mạng lâm thời (60 ha) và Căn cứ Mặt trận Dân tộc Giải phóng miền Nam (30 ha); khu vực nghiên cứu khoảng 291,25 ha.`},{name:`Tu bổ, nâng cấp các nhà phục dựng tại 3 cụm di tích`,type:`Dự án bảo tồn`,scale:`Khoảng 20,64 tỷ đồng`,status:`Đang triển khai — hoàn thành trước 30/4/2027`,desc:`Sử dụng ngân sách tỉnh; sửa chữa 9 nhà tại Căn cứ Mặt trận, 20/21 nhà tại Căn cứ Trung ương Cục và 10 nhà cùng bia tưởng niệm tại Căn cứ Chính phủ Cách mạng lâm thời.`}],Fe=[{name:`Cổng thông tin quy hoạch xây dựng và quy hoạch đô thị Việt Nam`,url:`https://quyhoach.xaydung.gov.vn/`}],Ie=[{icon:`upload`,title:`Nộp hồ sơ trực tuyến`,desc:`Cổng Dịch vụ công quốc gia`,url:`https://dichvucong.gov.vn/`},{icon:`search`,title:`Tra cứu thủ tục hành chính`,desc:`Danh mục thủ tục, thành phần hồ sơ`,url:`https://dichvucong.gov.vn/tra-cuu-thu-tuc/danh-sach`},{icon:`file`,title:`Tra cứu kết quả hồ sơ`,desc:`Theo dõi tiến độ giải quyết`,url:`https://dichvucong.gov.vn/tra-cuu-ho-so`}],Le=[{name:`Đăng ký khai sinh`,field:`Hộ tịch`,online:!0,note:`Có thể thực hiện liên thông khai sinh – thường trú – cấp thẻ BHYT trẻ em dưới 6 tuổi.`},{name:`Đăng ký khai tử`,field:`Hộ tịch`,online:!0,note:`Có thể liên thông với xóa đăng ký thường trú, hưởng chế độ tử tuất, mai táng phí.`},{name:`Đăng ký kết hôn`,field:`Hộ tịch`,online:!0,note:`Hai bên nam, nữ có mặt khi nhận Giấy chứng nhận kết hôn.`},{name:`Cấp bản sao trích lục hộ tịch`,field:`Hộ tịch`,online:!0,note:``},{name:`Xác nhận tình trạng hôn nhân`,field:`Hộ tịch`,online:!0,note:``},{name:`Chứng thực bản sao từ bản chính`,field:`Chứng thực`,online:!0,note:`Có thể yêu cầu cấp bản sao điện tử từ bản chính.`},{name:`Chứng thực chữ ký`,field:`Chứng thực`,online:!1,note:`Người yêu cầu ký trước mặt người thực hiện chứng thực.`},{name:`Chứng thực hợp đồng, giao dịch`,field:`Chứng thực`,online:!1,note:``},{name:`Đăng ký thường trú / tạm trú`,field:`Cư trú`,online:!0,note:`Thực hiện qua VNeID hoặc Cổng dịch vụ công.`},{name:`Đăng ký biến động đất đai`,field:`Đất đai`,online:!0,note:``},{name:`Trợ cấp xã hội hằng tháng`,field:`Bảo trợ xã hội`,online:!0,note:`Xem thêm mục An sinh xã hội.`},{name:`Cấp giấy phép xây dựng nhà ở riêng lẻ`,field:`Xây dựng`,online:!     </svg>`),Be=[`Thông báo`,`Tin địa phương`,`Chuyển đổi số`,`An sinh xã hội`,`Quy hoạch – xây dựng`,`Hướng dẫn`],Ve=[{slug:`tu-bo-di-tich-can-cu-trung-uong-cuc-mien-nam`,title:`Tu bổ, nâng tầm giá trị Khu di tích Căn cứ Trung ương Cục miền Nam`,category:`Quy hoạch – xây dựng`,date:`30/09/2026`,image:C.forest,featured:!0,summary:`Tỉnh Tây Ninh đầu tư khoảng 20,64 tỷ đồng tu bổ các nhà phục dựng tại 3 cụm di tích quốc gia đặc biệt trên địa bàn xã Tân Lập, dự kiến hoàn thành trước 30/4/2027.`,body:[`Khu di tích Căn cứ Trung ương Cục miền Nam nằm dưới tán rừng biên giới thuộc xã Tân Lập — di tích quốc gia đặc biệt, “địa chỉ đỏ” giáo dục truyền thống của cả nước.`,`Qua khảo sát, nhiều hạng mục phục dựng đã xuống cấp: 9 nhà tại Căn cứ Mặt trận Dân tộc Giải phóng miền Nam, 20/21 nhà tại Căn cứ Trung ương Cục miền Nam, cùng 10 nhà và 1 bia tưởng niệm tại Căn cứ Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam cần được tu sửa.`,`Dự án sử dụng ngân sách tỉnh với tổng mức khoảng 20,64 tỷ đồng, mục tiêu hoàn thành trước ngày 30/4/2027. Song song, tỉnh đang triển khai lập quy hoạch bảo quản, tu bổ, phục hồi khu di tích theo nhiệm vụ đã được Thủ tướng Chính phủ phê duyệt tại Quyết định số 88/QĐ-TTg ngày 15/01/2026.`,`Việc tu bổ góp phần giữ gìn giá trị lịch sử, đồng thời tạo điều kiện phát triển du lịch về nguồn bền vững cho xã Tân Lập.`],source:{name:`Báo Tin tức và Dân tộc (TTXVN)`,url:`https://baotintuc.vn/tu-bo-nang-tam-gia-tri-di-san-can-cu-trung-uong-cuc-mien-nam-post1390166.html`}},{slug:`dai-hoi-hoi-nan-nhan-chat-doc-da-cam-xa-tan-lap`,title:`Đại hội Hội Nạn nhân chất độc da cam/dioxin xã Tân Lập lần thứ I, nhiệm kỳ 2026 – 2031`,category:`An sinh xã hội`,date:`07/09/2026`,image:ze(`An sinh xã hội`,`#ff6f98`,`#c2255c`),summary:`Đại hội bầu 13 ủy viên Ban Chấp hành; ông Quản Trần Rễ được bầu làm Chủ tịch Hội. Nhiệm kỳ qua, Hội vận động hơn 567 triệu đồng chăm lo nạn nhân.`,body:[`Ngày 07/9/2026, Hội Nạn nhân chất độc da cam/dioxin xã Tân Lập tổ chức Đại hội lần thứ I, nhiệm kỳ 2026 – 2031, với phương châm “Đoàn kết, nghĩa tình, trách nhiệm; hướng về cơ sở, hướng về nạn nhân”. Dự đại hội có bà Nguyễn Thị Bạch Huệ – Ủy viên Ban Chấp hành Trung ương Hội, Chủ tịch Hội Nạn nhân chất độc da cam/dioxin tỉnh.`,`Hội hiện có 167 hội viên. Giai đoạn 2023 – 2026, Hội vận động được hơn 567 triệu đồng; thăm hỏi 133 lượt nạn nhân với số tiền hơn 96 triệu đồng; phối hợp khám bệnh miễn phí cho 137 lượt người cao tuổi, người khuyết tật, người thu nhập thấp và gia đình nạn nhân (hơn 36 triệu đồng); cùng các đơn vị, nhà hảo tâm trao 371 phần quà trị giá 212 triệu đồng, trong đó 112 phần quà dành cho nạn nhân và gia đình.`,`Đại hội bầu 13 ủy viên Ban Chấp hành; ông Quản Trần Rễ được bầu giữ chức Chủ tịch Hội nhiệm kỳ 2026 – 2031. Đại hội cũng bầu 3 đại biểu chính thức và 1 đại biểu dự khuyết dự Đại hội Hội tỉnh lần thứ VI.`,`Nhiệm kỳ mới, Hội phấn đấu 100% nạn nhân đủ điều kiện được kết nạp, duy trì thăm hỏi hằng tháng, quan tâm đặc biệt nạn nhân thế hệ thứ hai, thứ ba có hoàn cảnh khó khăn.`],source:{name:`Báo và Phát thanh, Truyền hình Tây Ninh`,url:`https://baotayninh.vn/ong-quan-tran-re-dac-cu-chu-tich-hoi-nan-nhan-chat-doc-da-cam-dioxin-xa-tan-lap-155946.html`}},{slug:`trao-huy-hieu-dang-dot-2-9-2026`,title:`Trao Huy hiệu Đảng cho 10 đảng viên xã Tân Lập nhân dịp Quốc khánh 2/9`,category:`Tin địa phương`,date:`28/08/2026`,image:ze(`Xây dựng Đảng`,`#ff7a59`,`#c81e1e`),summary:`Đồng chí Trương Nhật Quang – Ủy viên Ban Thường vụ, Trưởng Ban Nội chính Tỉnh ủy dự và trao Huy hiệu 45 năm, 35 năm tuổi Đảng cho đảng viên xã Tân Lập.`,body:[`Sáng 28/8/2026, Đảng ủy xã Tân Lập tổ chức lễ trao Huy hiệu Đảng đợt 2/9 cho đảng viên. Dự buổi lễ có đồng chí Trương Nhật Quang – Ủy viên Ban Thường vụ Tỉnh ủy, Trưởng Ban Nội chính Tỉnh ủy; đồng chí Nguyễn Trọng Tấn – Bí thư Đảng ủy, Chủ tịch HĐND xã; đồng chí Trịnh Hoài Phong – Phó Bí thư Thường trực Đảng ủy, Chủ tịch Ủy ban MTTQ Việt Nam xã; đồng chí Nguyễn Thị Nga – Phó Bí thư Đảng ủy, Chủ tịch UBND xã.`,`Đợt này có 10 đảng viên được trao Huy hiệu, gồm 1 đảng viên nhận Huy hiệu 45 năm tuổi Đảng và 9 đảng viên nhận Huy hiệu 35 năm tuổi Đảng, theo quyết định của Ban Thường vụ Tỉnh ủy.`,`Phát biểu tại buổi lễ, đồng chí Trương Nhật Quang chúc mừng các đảng viên; khẳng định việc trao Huy hiệu nhân dịp kỷ niệm 81 năm Cách mạng Tháng Tám và Quốc khánh 2/9 thể hiện sự ghi nhận, tri ân của Đảng đối với những đóng góp của các đảng viên.`,`Thay mặt các đảng viên, đồng chí Đinh Quang Phóng (Huy hiệu 45 năm tuổi Đảng) bày tỏ niềm vinh dự và hứa tiếp tục giữ gìn phẩm chất người đảng viên, tham gia xây dựng Đảng, chính quyền và các phong trào thi đua ở địa phương.`],source:{name:`Báo và Phát thanh, Truyền hình Tây Ninh`,url:`https://baotayninh.vn/uy-vien-ban-thuong-vu-tinh-uy-truong-ban-noi-chinh-tinh-uy-truong-nhat-quang-trao-huy-hieu-dang-cho-dang-vien-tai-xa-tan-lap-155373.html`}},{slug:`khao-sat-chuyen-doi-so-xa-tan-lap-2026`,title:`Tân Lập: 99,07% hồ sơ thủ tục hành chính được nộp trực tuyến`,category:`Chuyển đổi số`,date:`26/08/2026`,image:ze(`Chuyển đổi số`,`#3b8bff`,`#1534a0`),summary:`Ủy ban MTTQ Việt Nam tỉnh khảo sát công tác chuyển đổi số, ứng dụng khoa học, công nghệ trong giải quyết thủ tục hành chính, cung cấp dịch vụ công năm 2026 tại xã Tân Lập.`,body:[`Ngày 26/8/2026, đoàn công tác Ban Thường trực Ủy ban MTTQ Việt Nam tỉnh do bà Lê Thị Cẩm Tú – Phó Chủ tịch Ủy ban MTTQ Việt Nam tỉnh làm trưởng đoàn đã khảo sát công tác chuyển đổi số, ứng dụng khoa học, công nghệ trong giải quyết thủ tục hành chính, cung cấp dịch vụ công năm 2026 tại xã Tân Lập.`,`Theo báo cáo do ông Nguyễn Văn Thạnh – Phó Chủ tịch UBND xã trình bày, xã có 428 thủ tục hành chính thuộc thẩm quyền, 100% được cung cấp dịch vụ công trực tuyến. Trong kỳ, xã tiếp nhận 10.825 hồ sơ; tỷ lệ nộp trực tuyến đạt 99,07%; số hóa hồ sơ và thanh toán trực tuyến đạt 100%; chỉ số hài lòng của người dân đạt 100%.`,`Xã đã đơn giản hóa 2 thủ tục trong lĩnh vực bảo trợ xã hội và hộ tịch, tiết kiệm hơn 115 triệu đồng, chi phí tuân thủ giảm bình quân 46,87%.`,`Bên cạnh kết quả đạt được, xã còn gặp khó khăn do địa bàn rộng sau sắp xếp, một bộ phận người cao tuổi và đồng bào dân tộc thiểu số còn hạn chế kỹ năng số, phần mềm đôi lúc lỗi kết nối. Đoàn khảo sát ghi nhận mô hình “Bình dân học vụ số” và Tổ công nghệ số cộng đồng hỗ trợ người dân vùng biên; đề nghị xã phối hợp các sở, ngành khắc phục lỗi đồng bộ phần mềm và nâng cấp hạ tầng công nghệ.`],source:{name:`Báo và Phát thanh, Truyền hình Tây Ninh`,url:`https://baotayninh.vn/uy-ban-mttq-viet-nam-tinh-tay-ninh-khao-sat-cong-tac-chuyen-doi-so-ung-dung-khoa-hoc-cong-nghe-trong-giai-quyet-thu-tuc-hanh-chinh-cung-cap-dich-vu-cong-nam-2026-tai-xa-tan-lap-155140.html`}},{slug:`giam-sat-moi-truong-chan-nuoi`,title:`HĐND xã giám sát công tác quản lý môi trường trong chăn nuôi`,category:`Tin địa phương`,date:`25/08/2026`,image:ze(`Môi trường – Nông nghiệp`,`#3ad67f`,`#0b7a43`),summary:`Trên địa bàn xã có 21 trang trại, 44 nhà yến và 336 hộ chăn nuôi nhỏ lẻ; chưa có điểm nóng ô nhiễm nhưng việc xử lý chất thải còn chưa đồng bộ.`,body:[`Ngày 25/8/2026, Đoàn giám sát HĐND xã Tân Lập tổ chức hội nghị giám sát chuyên đề công tác quản lý môi trường trong chăn nuôi đối với UBND xã. Bà Đặng Tuyết Mai – Trưởng Ban Kinh tế – Ngân sách HĐND xã chủ trì; dự có bà Nguyễn Thị Cúc – Phó Chủ tịch HĐND xã.`,`Theo báo cáo, toàn xã có 21 trang trại chăn nuôi (17 trang trại đang hoạt động, 4 trang trại chưa hoạt động), 44 nhà yến và 336 hộ chăn nuôi nhỏ lẻ. Chăn nuôi phát triển cả về số lượng và quy mô, chuyển dần từ nhỏ lẻ sang trang trại. Địa bàn chưa có “điểm nóng” ô nhiễm, song ý thức của một bộ phận người dân còn hạn chế, việc xử lý chất thải chưa đồng bộ, còn phát sinh mùi hôi.`,`Đoàn giám sát đề nghị UBND xã tăng cường thống kê, tuyên truyền, hướng dẫn người dân đầu tư hầm biogas, đệm lót sinh học và phòng, chống dịch bệnh trên đàn vật nuôi.`,`UBND xã cam kết cập nhật số liệu chăn nuôi thường xuyên, kiểm tra định kỳ các trang trại quy mô vừa và nhỏ, xử lý vi phạm về bảo vệ môi trường và công khai 7 khu vực không được phép chăn nuôi theo Nghị quyết số 54/2026/NQ-HĐND của HĐND tỉnh.`],source:{name:`Báo và Phát thanh, Truyền hình Tây Ninh`,url:`https://baotayninh.vn/giam-sat-cong-tac-quan-ly-moi-truong-trong-chan-nuoi-tren-dia-ban-xa-tan-lap-155039.html`}},{slug:`thong-tin-lien-he-trung-tam-phuc-vu-hanh-chinh-cong`,title:`Thông tin liên hệ Trung tâm Phục vụ hành chính công xã Tân Lập`,category:`Thông báo`,date:``,image:ze(`Thông báo`,`#ffa142`,`#d9480f`),summary:`Địa chỉ và số điện thoại đường dây nóng của Trung tâm Phục vụ hành chính công xã để người dân liên hệ giải quyết thủ tục.`,body:[`Trung tâm Phục vụ hành chính công xã Tân Lập đặt tại Tổ 14, ấp Tân Hòa, xã Tân Lập, tỉnh Tây Ninh — cùng khu vực trụ sở Đảng ủy – HĐND – UBND xã.`,`Số điện thoại đường dây nóng: 0276.3742.139 và 0327.208.848.`,`Người dân có thể nộp hồ sơ trực tiếp tại Trung tâm hoặc nộp trực tuyến qua Cổng Dịch vụ công quốc gia bằng tài khoản VNeID mức độ 2. Thời gian làm việc: Thứ Hai – Thứ Sáu, trong giờ hành chính.`],source:{name:`Tuổi Trẻ Online`,url:`https://tuoitre.vn/dia-chi-so-dien-thoai-trung-tam-hanh-chinh-cong-96-xa-phuong-tinh-tay-ninh-moi-20250628115140108.htm`}},{slug:`huong-dan-nop-ho-so-truc-tuyen`,title:`Hướng dẫn người dân nộp hồ sơ thủ tục hành chính trực tuyến`,category:`Hướng dẫn`,date:``,image:ze(`Hướng dẫn`,`#a283ff`,`#5028c8`),summary:`Các bước chuẩn bị tài khoản VNeID, đăng nhập Cổng Dịch vụ công quốc gia và theo dõi kết quả hồ sơ.`,body:[`Để nộp hồ sơ trực tuyến, người dân cần có tài khoản định danh điện tử VNeID mức độ 2. Nếu chưa có, người dân liên hệ Công an xã để được hướng dẫn đăng ký.`,`Sau khi có tài khoản, truy cập Cổng Dịch vụ công quốc gia (dichvucong.gov.vn), chọn Đăng nhập bằng VNeID, tìm thủ tục cần thực hiện và chọn cơ quan giải quyết là UBND xã Tân Lập.`,`Người dân điền tờ khai, đính kèm ảnh chụp hoặc bản điện tử các giấy tờ, thanh toán phí/lệ phí (nếu có) và nhận mã hồ sơ để tra cứu tiến độ. Kết quả có thể nhận trực tuyến hoặc tại Trung tâm Phục vụ hành chính công xã.`,`Trường hợp gặp khó khăn, người dân có thể đến Trung tâm Phục vụ hành chính công xã hoặc liên hệ Tổ công nghệ số cộng đồng tại ấp để được hỗ trợ.`]}],He=[`Giao thông`,`Môi trường`,`An ninh, trật tự`,`Đất đai – xây dựng`,`Điện, nước, hạ tầng`,`Y tế – giáo dục`,`Thủ tục hành chính`,`Khác`],Ue=[{q:`Tôi có cần đăng nhập để gửi phản ánh không?`,a:`Không. Người dân gửi phản ánh trực tiếp tại mục Phản ánh kiến nghị, chỉ cần họ tên, số điện thoại và mô tả sự việc. Hệ thống cấp mã phản ánh để tra cứu tiến độ.`},{q:`Làm sao nộp hồ sơ thủ tục hành chính trực tuyến?`,a:`Người dân dùng tài khoản VNeID mức độ 2 để đăng nhập Cổng Dịch vụ công quốc gia, chọn thủ tục và cơ quan giải quyết là UBND xã Tân Lập. Xem hướng dẫn chi tiết tại mục Dịch vụ công.`},{q:`Trụ sở UBND xã Tân Lập ở đâu?`,a:`Trụ sở Đảng ủy – HĐND – UBND xã đặt tại Tổ 14, ấp Tân Hòa, xã Tân Lập, tỉnh Tây Ninh.`},{q:`Xã Tân Lập được thành lập từ những đơn vị nào?`,a:`Xã Tân Lập được thành lập trên cơ sở sắp xếp xã Tân Lập (huyện Tân Biên cũ) và xã Thạnh Bắc theo Nghị quyết số 1682/NQ-UBTVQH15, hoạt động từ ngày 01/07/2025.`},{q:`Tôi muốn biết mình có thuộc đối tượng được hưởng chính sách an sinh không?`,a:`Xem mục An sinh xã hội để tra cứu theo nhóm chính sách, điều kiện và hồ sơ cần chuẩn bị; hoặc liên hệ Trung tâm Phục vụ hành chính công xã để được tư vấn.`},{q:`Thông tin cá nhân tôi gửi có được bảo mật không?`,a:`Thông tin chỉ được dùng để tiếp nhận, xử lý và phản hồi phản ánh, không công khai họ tên, số điện thoại của người gửi. Xem thêm Chính sách bảo mật.`}];function We(){let[e,t]=(0,_.useState)(``),n=()=>te(`/tim-kiem?q=${encodeURIComponent(e.trim())}`);return(0,b.jsx)(`section`,{className:`hero`,children:(0,b.jsxs)(`div`,{className:`container hero__inner`,children:[(0,b.jsxs)(`div`,{className:`hero__content`,children:[(0,b.jsx)(`span`,{className:`welcome`,children:`Chào mừng bạn đến với`}),(0,b.jsxs)(`h1`,{children:[`TÂN LẬP `,(0,b.jsx)(`em`,{childre
